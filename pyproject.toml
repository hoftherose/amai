[project]
name = "Amai"
version = "0.1.0"
description = "Backend for AI pipeline integration."
readme = "README.md"
authors = [
    { name = "Holy Tech", email = "holytech.twitch@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=25.9.0",
    "fastapi>=0.115.12",
    "fastmcp>=2.2.0",
    "libsql-experimental>=0.0.52",
    "mcp[cli]>=1.6.0",
    "ollama>=0.4.8",
    "uvicorn>=0.34.1",
]

[project.scripts]
amai = "src:main"

